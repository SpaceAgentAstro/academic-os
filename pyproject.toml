[tool.vercel]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
# Register the asyncio marker and let pytest-asyncio run coroutine tests
# natively (the Telegram command handlers are async — see RT-013).
asyncio_mode = "auto"
markers = [
    "asyncio: mark a coroutine test to be run by pytest-asyncio",
]

[tool.ruff.lint.per-file-ignores]
# scripts/* deliberately mutate sys.path before importing local packages, so the
# E402 (module import not at top) on those bootstrap imports is intentional.
"scripts/*" = ["E402"]
